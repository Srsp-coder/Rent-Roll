<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User Account — RentRoll Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/users}" class="text-decoration-none">Users</a></li>
                    <li class="breadcrumb-item active" aria-current="page">New User</li>
                </ol>
            </nav>

            <div class="custom-card" style="max-width: 780px;">
                <div class="custom-card-header">
                    <h3 class="custom-card-title"><i class="bi bi-person-plus text-teal"></i> Create New User Account</h3>
                </div>
                <div class="custom-card-body p-4">
                    <form th:action="@{/users/new}" th:object="${userForm}" method="post">

                        <div class="row g-3 mb-3">
                            <div class="col-md-7">
                                <label for="fullName" class="form-label fw-semibold text-secondary">Full Legal Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                       placeholder="e.g. Rahul Deshmukh"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Error</div>
                            </div>

                            <div class="col-md-5">
                                <label for="role" class="form-label fw-semibold text-secondary">System Role <span class="text-danger">*</span></label>
                                <select class="form-select" id="role" th:field="*{role}"
                                        th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                                    <option value="">-- Choose Role --</option>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}">Role</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Error</div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold text-secondary">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                       placeholder="e.g. rahul@example.com"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                            </div>

                            <div class="col-md-6">
                                <label for="phoneNumber" class="form-label fw-semibold text-secondary">Phone Number</label>
                                <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}"
                                       placeholder="e.g. +91 9876543210">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">Initial Password <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   placeholder="Minimum 6 characters"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <div class="form-text">The user can use this password to sign in to RentRoll. Stored as BCrypt hash.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/users}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-teal px-4">
                                <i class="bi bi-check-lg me-1"></i> Create User Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
