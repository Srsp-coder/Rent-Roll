<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'User Profile - ' + ${user.fullName} + ' — RentRoll'">User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/users}" class="text-decoration-none">Users</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${user.fullName}">Profile</li>
                </ol>
            </nav>

            <div class="custom-card" style="max-width: 760px;">
                <div class="custom-card-header">
                    <h3 class="custom-card-title"><i class="bi bi-person-circle text-teal"></i> User Account Details</h3>
                    <span th:if="${user.active}" class="badge-status badge-paid"><i class="bi bi-check-circle-fill"></i> Active</span>
                    <span th:unless="${user.active}" class="badge-status badge-cancelled"><i class="bi bi-dash-circle-fill"></i> Deactivated</span>
                </div>
                <div class="custom-card-body p-4">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="stat-icon icon-teal fs-2" style="width: 56px; height: 56px;">
                            <i class="bi bi-person"></i>
                        </div>
                        <div>
                            <h3 class="h5 fw-bold text-dark mb-1" th:text="${user.fullName}">User Name</h3>
                            <div class="text-muted small" th:text="${user.email}">user@rentroll.in</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <div class="p-3 bg-light rounded-3">
                                <div class="text-muted small">System Role</div>
                                <div class="fw-semibold text-dark" th:text="${user.role.displayName}">Role</div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-3 bg-light rounded-3">
                                <div class="text-muted small">Phone Number</div>
                                <div class="fw-semibold text-dark" th:text="${user.phoneNumber != null ? user.phoneNumber : 'Not provided'}">Phone</div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-3 bg-light rounded-3">
                                <div class="text-muted small">Account ID</div>
                                <div class="fw-semibold text-dark">#<span th:text="${user.id}">1</span></div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-3 bg-light rounded-3">
                                <div class="text-muted small">Registered Since</div>
                                <div class="fw-semibold text-dark" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</div>
                            </div>
                        </div>
                    </div>

                    <!-- Account Actions -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a th:href="@{/users}" class="btn btn-light border">
                            <i class="bi bi-arrow-left me-1"></i> Back to Users Directory
                        </a>

                        <!-- Deactivate / Activate Button -->
                        <form th:action="@{/users/{id}/toggle-active(id=${user.id})}" method="post">
                            <button th:if="${user.active}" type="submit" class="btn btn-outline-danger">
                                <i class="bi bi-person-slash me-1"></i> Deactivate Account
                            </button>
                            <button th:unless="${user.active}" type="submit" class="btn btn-outline-success">
                                <i class="bi bi-person-check me-1"></i> Reactivate Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
