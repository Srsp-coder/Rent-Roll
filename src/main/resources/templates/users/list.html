<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Accounts — RentRoll Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <h2 class="h4 fw-bold text-dark mb-1">User Account Directory</h2>
                    <p class="text-muted small mb-0">System administration for Landlords, Tenants, and Administrator logins.</p>
                </div>
                <div>
                    <a th:href="@{/users/new}" class="btn btn-primary-teal btn-sm px-3 py-2 rounded-3">
                        <i class="bi bi-person-plus me-1"></i> Create User Account
                    </a>
                </div>
            </div>

            <!-- Users Table Card -->
            <div class="custom-card">
                <div class="table-responsive">
                    <table class="table custom-table">
                        <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Full Name &amp; Email</th>
                            <th>Role</th>
                            <th>Phone Number</th>
                            <th>Account Status</th>
                            <th>Created Date</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td class="fw-bold text-teal" th:text="'#' + ${u.id}">#1</td>
                            <td>
                                <div class="fw-semibold text-dark small" th:text="${u.fullName}">Anita Sharma</div>
                                <div class="text-muted" style="font-size: 0.72rem;" th:text="${u.email}">admin@rentroll.in</div>
                            </td>
                            <td>
                                <span th:if="${u.role.name() == 'ADMIN'}" class="badge bg-dark text-white px-2 py-1">Administrator</span>
                                <span th:if="${u.role.name() == 'LANDLORD'}" class="badge bg-teal-subtle text-teal px-2 py-1" style="background-color: #ccfbf1; color: #0f766e;">Landlord</span>
                                <span th:if="${u.role.name() == 'TENANT'}" class="badge bg-primary-subtle text-primary px-2 py-1">Tenant</span>
                            </td>
                            <td class="small text-secondary" th:text="${u.phoneNumber != null ? u.phoneNumber : '&mdash;'}">&mdash;</td>
                            <td>
                                <span th:if="${u.active}" class="badge-status badge-paid"><i class="bi bi-check-circle-fill"></i> Active</span>
                                <span th:unless="${u.active}" class="badge-status badge-cancelled"><i class="bi bi-dash-circle-fill"></i> Deactivated</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td>
                                <a th:href="@{/users/{id}(id=${u.id})}" class="btn btn-sm btn-outline-teal py-1 px-2 rounded-2">
                                    Manage
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
