<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<header th:fragment="navbar" class="app-topbar">
    <div class="topbar-left">
        <button id="sidebarToggleBtn" class="btn btn-sm btn-light border d-lg-none" type="button" aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <h1 class="topbar-title" th:text="${pageTitle != null ? pageTitle : 'RentRoll'}">Dashboard</h1>
    </div>

    <div class="topbar-right">
        <!-- Indian Rupee Locale Indicator -->
        <span class="badge bg-light text-secondary border px-2 py-1 rounded-pill d-none d-sm-inline-flex align-items-center gap-1">
            <i class="bi bi-geo-alt-fill text-teal" style="color: #0d9488;"></i> India (₹ INR)
        </span>

        <!-- User Dropdown Menu -->
        <div class="dropdown">
            <button class="btn btn-sm btn-light border dropdown-toggle d-flex align-items-center gap-2"
                    type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-5" style="color: #0d9488;"></i>
                <span class="d-none d-md-inline font-semibold" th:text="${currentUser != null ? currentUser.fullName : #authentication.name}">Account</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenuDropdown" style="min-width: 220px;">
                <li class="px-3 py-2 border-bottom">
                    <div class="fw-bold text-dark small" th:text="${currentUser != null ? currentUser.fullName : 'Signed In'}">User Name</div>
                    <div class="text-muted small" th:text="${currentUser != null ? currentUser.email : ''}">user@rentroll.in</div>
                    <span class="badge bg-teal-subtle text-teal mt-1" style="background-color: #ccfbf1; color: #0f766e;"
                          th:text="${currentUser != null ? currentUser.role.displayName : ''}">Role</span>
                </li>
                <li><a class="dropdown-item py-2" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item py-2" th:href="@{/users}"><i class="bi bi-people me-2"></i> User Management</a></li>
                <li><hr class="dropdown-divider my-1"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="dropdown-item text-danger py-2 d-flex align-items-center">
                            <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
