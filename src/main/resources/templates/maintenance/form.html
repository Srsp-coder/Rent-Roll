<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Maintenance Request — RentRoll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/maintenance}" class="text-decoration-none">Maintenance</a></li>
                    <li class="breadcrumb-item active" aria-current="page">New Request</li>
                </ol>
            </nav>

            <div class="custom-card" style="max-width: 820px;">
                <div class="custom-card-header">
                    <h3 class="custom-card-title"><i class="bi bi-tools text-teal"></i> Raise Maintenance or Repair Request</h3>
                </div>
                <div class="custom-card-body p-4">
                    <form th:action="@{/maintenance/new}" th:object="${maintenanceForm}" method="post">

                        <!-- Property Selection -->
                        <div class="mb-3">
                            <label for="propertyId" class="form-label fw-semibold text-secondary">Property Unit <span class="text-danger">*</span></label>
                            <select class="form-select" id="propertyId" th:field="*{propertyId}"
                                    th:classappend="${#fields.hasErrors('propertyId')} ? 'is-invalid' : ''">
                                <option value="">-- Select Leased Property --</option>
                                <option th:each="prop : ${properties}"
                                        th:value="${prop.id}"
                                        th:text="${prop.propertyName + ' (' + prop.city + ')'}">Property</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('propertyId')}" th:errors="*{propertyId}">Error</div>
                        </div>

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold text-secondary">Issue Summary / Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" th:field="*{title}"
                                   placeholder="e.g. Kitchen tap mixer leaking water persistently"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error</div>
                        </div>

                        <!-- Category and Priority Row -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold text-secondary">Category <span class="text-danger">*</span></label>
                                <select class="form-select" id="category" th:field="*{category}"
                                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Category</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Error</div>
                            </div>

                            <div class="col-md-6">
                                <label for="priority" class="form-label fw-semibold text-secondary">Urgency / Priority <span class="text-danger">*</span></label>
                                <select class="form-select" id="priority" th:field="*{priority}">
                                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName}">Priority</option>
                                </select>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold text-secondary">Detailed Problem Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="4"
                                      placeholder="Please describe exactly when the issue started, location in the house, severity, and any temporary fixes you attempted..."
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/maintenance}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-teal px-4">
                                <i class="bi bi-send me-1"></i> Submit Repair Request
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
