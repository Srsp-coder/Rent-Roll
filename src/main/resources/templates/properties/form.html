<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Property — RentRoll' : 'Add Property — RentRoll'">Property Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <div class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/properties}" class="text-decoration-none">Properties</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit} ? 'Edit Property' : 'New Property'">Form</li>
                </ol>
            </nav>

            <div class="custom-card" style="max-width: 860px;">
                <div class="custom-card-header">
                    <h3 class="custom-card-title">
                        <i class="bi bi-building text-teal"></i>
                        <span th:text="${isEdit} ? 'Edit Property Details' : 'Add New Rental Property Listing'">Add Property</span>
                    </h3>
                </div>
                <div class="custom-card-body p-4">
                    <form th:action="${isEdit} ? @{/properties/{id}/edit(id=${propertyForm.id})} : @{/properties/new}"
                          th:object="${propertyForm}" method="post">

                        <!-- For Admin: Choose Landlord -->
                        <div sec:authorize="hasRole('ADMIN')" th:if="${!isEdit}" class="mb-4 p-3 bg-light rounded-3 border">
                            <label for="landlordId" class="form-label fw-semibold text-dark">Assign to Landlord</label>
                            <select class="form-select" id="landlordId" th:field="*{landlordId}">
                                <option value="">-- Assign to myself or select a landlord --</option>
                                <option th:each="ll : ${landlords}" th:value="${ll.id}" th:text="${ll.fullName + ' (' + ll.email + ')'}">Landlord</option>
                            </select>
                            <div class="form-text">As an Administrator, you can assign this property to any registered landlord.</div>
                        </div>

                        <!-- Basic Information -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label for="propertyName" class="form-label fw-semibold text-secondary">Property Name / Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="propertyName" th:field="*{propertyName}"
                                       placeholder="e.g. Prestige Shantiniketan - Flat 702"
                                       th:classappend="${#fields.hasErrors('propertyName')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('propertyName')}" th:errors="*{propertyName}">Error</div>
                            </div>

                            <div class="col-md-4">
                                <label for="propertyType" class="form-label fw-semibold text-secondary">Property Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="propertyType" th:field="*{propertyType}"
                                        th:classappend="${#fields.hasErrors('propertyType')} ? 'is-invalid' : ''">
                                    <option value="">Select Type</option>
                                    <option th:each="pt : ${propertyTypes}" th:value="${pt}" th:text="${pt.displayName}">Type</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('propertyType')}" th:errors="*{propertyType}">Error</div>
                            </div>
                        </div>

                        <!-- Address Fields -->
                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold text-secondary">Street Address / Locality <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="address" th:field="*{address}"
                                   placeholder="e.g. Tower 4, ITPL Main Road, Whitefield"
                                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Error</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label for="city" class="form-label fw-semibold text-secondary">City <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="city" th:field="*{city}"
                                       placeholder="e.g. Bengaluru"
                                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Error</div>
                            </div>

                            <div class="col-md-4">
                                <label for="state" class="form-label fw-semibold text-secondary">State <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="state" th:field="*{state}"
                                       placeholder="e.g. Karnataka"
                                       th:classappend="${#fields.hasErrors('state')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}">Error</div>
                            </div>

                            <div class="col-md-3">
                                <label for="pinCode" class="form-label fw-semibold text-secondary">PIN Code <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="pinCode" th:field="*{pinCode}"
                                       placeholder="e.g. 560066" maxlength="6"
                                       th:classappend="${#fields.hasErrors('pinCode')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('pinCode')}" th:errors="*{pinCode}">Error</div>
                            </div>
                        </div>

                        <!-- Configurations & Rent -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="bedrooms" class="form-label fw-semibold text-secondary">Bedrooms (BHK)</label>
                                <input type="number" class="form-control" id="bedrooms" th:field="*{bedrooms}"
                                       min="0" max="15" placeholder="e.g. 2">
                                <div class="form-text">Enter 0 for studio / single room.</div>
                            </div>

                            <div class="col-md-6">
                                <label for="monthlyRent" class="form-label fw-semibold text-secondary">Monthly Asking Rent (₹ INR) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="100" class="form-control" id="monthlyRent" th:field="*{monthlyRent}"
                                           placeholder="e.g. 35000"
                                           th:classappend="${#fields.hasErrors('monthlyRent')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('monthlyRent')}" th:errors="*{monthlyRent}">Error</div>
                                </div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold text-secondary">Description &amp; Amenities</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="4"
                                      placeholder="Describe floor number, furnishings, parking, power backup, nearby metro/landmarks..."></textarea>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/properties}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary-teal px-4">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${isEdit} ? 'Save Changes' : 'Create Property'">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
