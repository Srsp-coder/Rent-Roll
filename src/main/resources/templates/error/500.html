<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Application Error | RentRoll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="text-center p-5 bg-white rounded-4 shadow-sm border" style="max-width: 540px;">
    <div class="text-warning mb-3" style="font-size: 4rem;">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="h3 fw-bold text-dark mb-2">500 &mdash; Internal Server Error</h1>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Something went wrong while processing your request.'}">
        An internal server error occurred.
    </p>
    <div th:if="${errorDetails}" class="p-3 bg-light rounded-3 text-start small text-danger font-monospace mb-4" style="max-height: 140px; overflow-y: auto;" th:text="${errorDetails}">
        Stack details
    </div>
    <div>
        <a th:href="@{/dashboard}" class="btn btn-primary-teal px-4">
            <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
</body>
</html>
