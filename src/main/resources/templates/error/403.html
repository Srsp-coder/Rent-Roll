<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Access Denied | RentRoll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="text-center p-5 bg-white rounded-4 shadow-sm border" style="max-width: 520px;">
    <div class="text-danger mb-3" style="font-size: 4rem;">
        <i class="bi bi-shield-x"></i>
    </div>
    <h1 class="h3 fw-bold text-dark mb-2">403 &mdash; Access Restricted</h1>
    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'You do not have the required permissions to access or modify this resource.'}">
        You do not have permission to access this page.
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/dashboard}" class="btn btn-primary-teal px-4">
            <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
        <a th:href="@{/login}" class="btn btn-light border px-4">
            Sign In Again
        </a>
    </div>
</div>
</body>
</html>
