# ===================================================================
# RentRoll Application Configuration (PostgreSQL Only)
# ===================================================================
spring.application.name=RentRoll
server.port=${PORT:8085}

# PostgreSQL Database Configuration via Environment Variables
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/rentrolldb}
spring.datasource.username=${DB_USERNAME:rentroll}
spring.datasource.password=${DB_PASSWORD:rentroll123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Currency & Locale Defaults (Indian Rupee context)
rentroll.currency.symbol=\u20B9
rentroll.currency.code=INR
rentroll.late-fee.percentage=0.05
