# ===================================================================
# RentRoll Application Configuration
# ===================================================================
spring.application.name=RentRoll
server.port=${PORT:8080}

# Default Database: H2 in-memory with PostgreSQL compatibility mode
# This allows instant zero-setup development for college students and local testing.
spring.datasource.url=jdbc:h2:mem:rentrolldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Currency & Locale Defaults (Indian Rupee context)
rentroll.currency.symbol=\u20B9
rentroll.currency.code=INR
rentroll.late-fee.percentage=0.05

