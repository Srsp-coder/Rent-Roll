# ===================================================================
# PostgreSQL Profile (Activate with: --spring.profiles.active=postgres)
# Or set environment variables: SPRING_PROFILES_ACTIVE=postgres
# ===================================================================

# Database Connection via Environment Variables with sensible defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentrolldb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

